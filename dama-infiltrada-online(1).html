<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dama Infiltrada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
html,body{margin:0}
/* Layout: coluna única para celular em retrato. Menu de modos, barra do jogador, tabuleiro verde clássico em largura total, controles e painel de lances. */
:root{
  --bg:#262522;--panel:#302e2b;--panel2:#3a3835;--line:#4a4743;--fg:#f5f5f4;--muted:#a9a49d;
  --em:#81b64c;--em-ink:#10180a;--gold:#f5c04a;--red:#ef4444;--danger:#b4232a;
  --sql:#ebecd0;--sqd:#739552;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#eeeeea;--panel:#ffffff;--panel2:#f4f3ef;--line:#d6d3cb;--fg:#1f1e1c;--muted:#6d6a63;--em:#5f9a2f;--em-ink:#ffffff;color-scheme:light}
}
:root[data-theme="light"]{--bg:#eeeeea;--panel:#ffffff;--panel2:#f4f3ef;--line:#d6d3cb;--fg:#1f1e1c;--muted:#6d6a63;--em:#5f9a2f;--em-ink:#ffffff;color-scheme:light}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding-block:8px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.app *{min-width:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font:700 21px/1.1 var(--display);letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.iconbtn:hover{border-color:var(--em)}

.menu{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--em)}
.mode strong{font:700 20px/1.2 var(--display)}
.mode span{color:var(--muted);font-size:14px}
.mode:hover{border-color:var(--em)}
.mode.ghost{border-left-color:var(--gold)}
.lobby{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding:16px}
.lobby h2{margin:0}
.or{text-align:center;color:var(--muted);font-size:13px}
.joinrow{display:flex;gap:8px}
.codein{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:700 20px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;text-align:center;min-height:46px;text-transform:uppercase}
.codein:focus-visible{outline:2px solid var(--gold)}
.msg{margin:0;color:var(--gold);font-size:14px}
.roomline{display:flex;gap:6px;align-items:baseline;color:var(--muted);font-size:13.5px}
.roomline strong{color:var(--fg);letter-spacing:.14em;font-family:ui-monospace,Menlo,Consolas,monospace}
.bigcode{font:700 40px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;padding:12px 8px;background:var(--panel2);border-radius:12px;user-select:all;-webkit-user-select:all}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.banner strong{display:block;font-size:15px}
.banner span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.banner.pick{border-color:var(--gold)}
.banner.result{border-color:var(--em)}

.bar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:44px}
.bar.turn{border-color:var(--em);box-shadow:0 0 0 1px var(--em) inset}
.disc{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid var(--line)}
.disc.w{background:#fff}
.disc.b{background:#1c1c1c}
.who{display:flex;flex-direction:column;line-height:1.15;flex:none}
.who small{color:var(--muted);font-size:12px}
.caps{display:flex;flex:1;align-items:center;padding-left:4px;overflow:hidden}
.capp{width:20px;height:20px;margin-right:-8px;flex:none}
.capp svg{width:100%;height:100%;display:block}
.adv{font-size:13px;font-weight:700;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--em);color:var(--em-ink);flex:none;white-space:nowrap}
.tag.red{background:var(--red);color:#fff;animation:tagp 1s ease-in-out infinite}
@keyframes tagp{50%{opacity:.6}}

/* tabuleiro */
.boardwrap{width:100%}
.board{position:relative;width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;cursor:pointer}
.sq.l{background:var(--sql)}
.sq.d{background:var(--sqd)}
.sq.l.last,.sq.l.sel{background:#f5f682}
.sq.d.last,.sq.d.sel{background:#b9ca43}
.sq.chk{background-image:radial-gradient(circle,rgba(239,68,68,.85) 0,rgba(239,68,68,.35) 62%,transparent 100%);animation:chk 1s ease-in-out infinite}
@keyframes chk{
  0%,100%{box-shadow:inset 0 0 0 3px rgba(239,68,68,.95),inset 0 0 20px 2px rgba(239,68,68,.8)}
  50%{box-shadow:inset 0 0 0 4px #ff3030,inset 0 0 6px rgba(239,68,68,.35)}}
.dot{position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.16);pointer-events:none;z-index:3}
.ring{position:absolute;inset:0;background:radial-gradient(transparent 0,transparent 78%,rgba(0,0,0,.2) 79%);pointer-events:none;z-index:3}
.lab{position:absolute;font:700 clamp(9px,2.7vw,12px)/1 var(--font);pointer-events:none}
.lab.rk{left:3px;top:3px}.lab.fl{right:3px;bottom:3px}
.sq.l .lab{color:var(--sqd)}.sq.d .lab{color:var(--sql)}
.sq.cand::after{content:'';position:absolute;inset:6%;border-radius:50%;border:3px dashed rgba(16,24,10,.8);animation:cand 1.4s ease-in-out infinite;z-index:3;pointer-events:none}
@keyframes cand{50%{opacity:.3;transform:scale(.92)}}
.flash{position:absolute;left:-40%;top:-40%;width:180%;height:180%;border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(circle,rgba(255,236,150,.98) 0,rgba(245,192,74,.55) 38%,transparent 70%);animation:flashA .7s ease-out forwards}
@keyframes flashA{from{transform:scale(.3);opacity:1}to{transform:scale(1);opacity:0}}

.layer{position:absolute;inset:0;pointer-events:none}
.ghosts{z-index:1}.pieces{z-index:2}.fxl{z-index:6}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .26s cubic-bezier(.3,.8,.3,1);will-change:transform}
.pc svg{width:100%;height:100%;display:block;overflow:visible}
.pc.pop{z-index:5}
.pc.pop svg{animation:popS .95s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 0 8px #f5c04a)}
@keyframes popS{0%{transform:scale(.5) rotate(-12deg)}35%{transform:scale(1.5) rotate(4deg)}65%{transform:scale(.92)}100%{transform:scale(1)}}
.pc.ghost{transition:none;animation:ghostA .5s ease-out forwards}
@keyframes ghostA{to{opacity:0}}
.sbadge{position:absolute;right:2%;top:2%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

.fx{position:absolute;width:12.5%;height:12.5%;pointer-events:none}
.fx i{position:absolute;left:50%;top:50%;display:block}
.fxring{width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;border:3px solid #ffe38a;box-shadow:0 0 16px #f5c04a;animation:ringA .8s ease-out forwards}
.fxring.r2{animation-delay:.12s;border-color:#fff3c4}
@keyframes ringA{from{transform:scale(.3);opacity:1}to{transform:scale(3.4);opacity:0}}
.fxglow{width:260%;height:260%;margin:-130% 0 0 -130%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.95),rgba(245,192,74,.4) 40%,transparent 70%);animation:glowA .9s ease-out forwards}
@keyframes glowA{from{transform:scale(.4);opacity:1}to{transform:scale(1.2);opacity:0}}
.fxp{border-radius:50%;background:radial-gradient(circle,#fff6c9,#f5c04a);box-shadow:0 0 8px #f5c04a;animation:burst .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}

.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

.toast{position:absolute;left:0;right:0;top:12%;margin:0 auto;width:max-content;max-width:92%;z-index:10;display:flex;gap:10px;align-items:center;
  padding:10px 14px;border-radius:14px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;animation:toastIn .38s cubic-bezier(.2,1.3,.4,1),toastOut .35s 1.6s forwards}
.toast .tt{display:flex;flex-direction:column}
.toast strong{font:700 17px/1.2 var(--display)}
.toast span{font-size:13px;opacity:.92;margin-top:2px}
.toast.block{background:linear-gradient(135deg,#7f1d1d,#b45309);border:1px solid #fca5a5}
.toast.reveal{background:linear-gradient(135deg,#7a5200,#c28a12);border:1px solid #ffe08a}
.toast.check{background:#b4232a;border:1px solid #fca5a5}
.toast.mate{background:linear-gradient(135deg,#3f6212,#5f8f22);border:1px solid #bef264}
.toast.draw{background:#334155;border:1px solid #94a3b8}
@keyframes toastIn{from{transform:translateY(-14px) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

.promo{position:absolute;inset:0;z-index:12;background:rgba(8,14,20,.66);display:flex;align-items:center;justify-content:center}
.promobox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:92%}
.promobox p{margin:0;font-weight:600}
.promorow{display:flex;gap:8px}
.pbtn{width:clamp(48px,15vw,66px);aspect-ratio:1/1;padding:2px;border-radius:10px;background:var(--sqd);border:2px solid transparent}
.pbtn:hover,.pbtn:focus-visible{border-color:var(--gold);outline:none}
.pbtn svg{width:100%;height:100%;display:block}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}

.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;background:var(--em);color:var(--em-ink);border:0;border-radius:11px;padding:11px 14px;font-weight:700;min-height:44px}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{padding:14px 28px;font-size:18px;flex:none}
.btn:disabled{opacity:.6;cursor:wait}
button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card h2{margin:0 0 6px;font:700 14px/1 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hist{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.muted{color:var(--muted);margin:0;font-size:13.5px}
.muted.small{font-size:12.5px}
.row{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center;padding:3px 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.row:nth-child(odd){background:var(--panel2)}
.row .num{color:var(--muted);font-size:13px}
.mv{display:inline-flex;align-items:center;gap:5px;font:600 15px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mv.empty{color:var(--muted)}
.row.ev{display:flex;gap:8px;font-size:13px;color:var(--gold);background:rgba(245,192,74,.1)}
details summary{cursor:pointer;font-weight:600;padding:2px 0}
.rules{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
.foot{margin:2px 0 0;color:var(--muted);font-size:12.5px;text-align:center}

.pass{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.passbox{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.passbox h2{margin:0;font:700 28px/1.2 var(--display);text-wrap:balance}
.passbox p{margin:0;color:var(--muted)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(6,10,14,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovcard{background:var(--panel);border:1px solid var(--gold);border-radius:18px;padding:22px 20px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:toastIn .4s cubic-bezier(.2,1.3,.4,1)}
.ovcard h2{margin:0;font:700 28px/1.1 var(--display)}
.ovcard .big{margin:0;font-size:17px}
.sec{list-style:none;margin:6px 0;padding:0;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.ovbtns{display:flex;gap:8px;width:100%;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  .shake,.sq.chk,.sq.cand::after,.tag.red{animation:none}
  .pc{transition:none}
  .fxp,.fxring,.fxglow{animation-duration:.01s}
}

</style>

<script id="online-shim">
/* Dama Infiltrada — adaptador online para Firebase Firestore.
   Preencha firebaseConfig com os dados do seu projeto Firebase.
   Não altere o restante do jogo. */
(function () {
  'use strict';

  var firebaseConfig = {
    apiKey: "AIzaSyBzYLqilhSY9SUWU1lOaBOzODTRnE7H9Ws",
    authDomain: "dama-secreta.firebaseapp.com",
    projectId: "dama-secreta",
    appId: "1:55250782613:web:2eef79751a75ff69ec8e9c",
    storageBucket: "dama-secreta.firebasestorage.app",
    messagingSenderId: "55250782613",
    measurementId: "G-9846G23W34"
  };

  var firebaseReady = null;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-firebase-src="' + src + '"]');
      if (existing) {
        if (existing.dataset.loaded === 'true') return resolve();
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', reject, { once: true });
        return;
      }
      var script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.dataset.firebaseSrc = src;
      script.onload = function () {
        script.dataset.loaded = 'true';
        resolve();
      };
      script.onerror = function () {
        reject(new Error('Não foi possível carregar o Firebase: ' + src));
      };
      document.head.appendChild(script);
    });
  }

  function initFirebase() {
    if (firebaseReady) return firebaseReady;
    firebaseReady = (async function () {
      var version = '10.14.1';
      await loadScript('https://www.gstatic.com/firebasejs/' + version + '/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/' + version + '/firebase-auth-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/' + version + '/firebase-firestore-compat.js');

      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      var auth = firebase.auth();
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      if (!auth.currentUser) await auth.signInAnonymously();

      return {
        auth: auth,
        firestore: firebase.firestore()
      };
    })().catch(function (err) {
      firebaseReady = null;
      throw err;
    });
    return firebaseReady;
  }

  var db = {
    doc: function (path) {
      var docPath = String(path || '');
      return {
        get: async function () {
          var services = await initFirebase();
          return services.firestore.doc(docPath).get();
        },
        set: async function (data) {
          var services = await initFirebase();
          await services.firestore.doc(docPath).set(data);
        },
        update: async function (data) {
          var services = await initFirebase();
          /* O Firestore rejeita automaticamente update() em documento inexistente. */
          await services.firestore.doc(docPath).update(data);
        },
        onSnapshot: function (next, error) {
          var active = true;
          var unsubscribe = null;
          initFirebase().then(function (services) {
            if (!active) return;
            unsubscribe = services.firestore.doc(docPath).onSnapshot(
              function (snapshot) {
                if (active && typeof next === 'function') next(snapshot);
              },
              function (err) {
                if (active && typeof error === 'function') error(err);
              }
            );
          }).catch(function (err) {
            if (active && typeof error === 'function') error(err);
          });
          return function () {
            active = false;
            if (unsubscribe) unsubscribe();
          };
        }
      };
    }
  };

  var user = {
    id: async function () {
      var services = await initFirebase();
      if (!services.auth.currentUser) {
        await services.auth.signInAnonymously();
      }
      return services.auth.currentUser.uid;
    }
  };

  window.claude = {
    use: async function (name) {
      if (name === 'db') {
        await initFirebase();
        return db;
      }
      if (name === 'user') {
        await initFirebase();
        return user;
      }
      return null;
    }
  };
})();
</script>
<script>
/* Dama Infiltrada — motor de xadrez próprio (sem dependências) */
var Engine=(function(){
'use strict';
const ix=(r,c)=>r*8+c;
const rc=i=>[i>>3,i&7];
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const opp=c=>c==='w'?'b':'w';
const FILES='abcdefgh';
const sqName=i=>FILES[i&7]+(8-(i>>3));
const ROOK_D=[[1,0],[-1,0],[0,1],[0,-1]];
const BISH_D=[[1,1],[1,-1],[-1,1],[-1,-1]];
const QUEEN_D=ROOK_D.concat(BISH_D);
const KNIGHT_D=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];

function initialBoard(){
  const b=Array(64).fill(null);
  const back=['r','n','b','q','k','b','n','r'];
  for(let c=0;c<8;c++){
    b[ix(0,c)]={t:back[c],c:'b',sec:false,id:'b-'+back[c]+'-'+c};
    b[ix(1,c)]={t:'p',c:'b',sec:false,id:'b-p-'+c};
    b[ix(6,c)]={t:'p',c:'w',sec:false,id:'w-p-'+c};
    b[ix(7,c)]={t:back[c],c:'w',sec:false,id:'w-'+back[c]+'-'+c};
  }
  return b;
}
function newState(board){
  return {board:board,turn:'w',castling:{wk:true,wq:true,bk:true,bq:true},ep:null,half:0,full:1};
}

/* ---------- ataques ---------- */
function clearLine(board,f,t){
  const fr=f>>3,fc=f&7,tr=t>>3,tc=t&7;
  const sr=Math.sign(tr-fr),sc=Math.sign(tc-fc);
  let r=fr+sr,c=fc+sc;
  while(r!==tr||c!==tc){ if(board[r*8+c])return false; r+=sr;c+=sc; }
  return true;
}
/* 0 = não ataca; 1 = ataque visível; 2 = ataque exclusivo de Dama oculta */
function attackKind(board,f,t,p){
  const fr=f>>3,fc=f&7,tr=t>>3,tc=t&7,dr=tr-fr,dc=tc-fc;
  const adr=Math.abs(dr),adc=Math.abs(dc);
  switch(p.t){
    case 'p':{
      const dir=p.c==='w'?-1:1;
      if(dr===dir&&adc===1)return 1;
      if(p.sec&&(dr===0||dc===0||adr===adc)&&clearLine(board,f,t))return 2;
      return 0;
    }
    case 'n':return adr*adc===2?1:0;
    case 'k':return Math.max(adr,adc)===1?1:0;
    case 'b':return (adr===adc&&adr>0&&clearLine(board,f,t))?1:0;

/* ---------- geração de lances ---------- */
function mk(from,to,o){

}
/* hp=true: peão oculto age só como peão */
function genMoves(state,from,hp){
  const board=state.board,castling=state.castling,ep=state.ep;
  const p=board[from];if(!p)return [];
  const r=from>>3,c=from&7,col=p.c,out=[];
  const step=(rr,cc)=>{
    if(!inb(rr,cc))return;
    const to=ix(rr,cc),t=board[to];
    if(!t)out.push(mk(from,to));else if(t.c!==col)out.push(mk(from,to,{cap:to}));
  };
  const slide=(dirs,extra,arr)=>{
    for(const d of dirs){
      let rr=r+d[0],cc=c+d[1];
      while(inb(rr,cc)){
        const to=ix(rr,cc),t=board[to];
        if(!t)arr.push(mk(from,to,extra));
        else{if(t.c!==col)arr.push(mk(from,to,Object.assign({cap:to},extra)));break;}
        rr+=d[0];cc+=d[1];
      }
    }
  };

    case 'p':{
      const dir=col==='w'?-1:1,start=col==='w'?6:1,last=col==='w'?0:7;
      const r1=r+dir;
      if(inb(r1,c)&&!board[ix(r1,c)]){
        out.push(mk(from,ix(r1,c),{promo:r1===last}));
        if(r===start&&!board[ix(r+2*dir,c)])out.push(mk(from,ix(r+2*dir,c),{dbl:true}));
      }
      for(const dc of [-1,1]){
        const cc=c+dc;if(!inb(r1,cc))continue;
        const to=ix(r1,cc),t=board[to];
        if(t&&t.c!==col)out.push(mk(from,to,{cap:to,promo:r1===last}));
        else if(!t&&ep===to)out.push(mk(from,to,{cap:ix(r,cc),ep:true}));
      }
      if(p.sec&&!hp){
        const have=new Set(out.map(m=>m.to));
        const tmp=[];
        slide(QUEEN_D,{qOnly:true},tmp);
        for(const m of tmp)if(!have.has(m.to))out.push(m);
      }
      break;
    }
    case 'n':for(const d of KNIGHT_D)step(r+d[0],c+d[1]);break;
    case 'b':slide(BISH_D,null,out);break;
    case 'r':slide(ROOK_D,null,out);break;
    case 'q':slide(QUEEN_D,null,out);break;
    case 'k':{
      for(const d of QUEEN_D)step(r+d[0],c+d[1]);
      const rank=col==='w'?7:0;
      if(from===ix(rank,4)){
        const R=cc=>{const x=board[ix(rank,cc)];return x&&x.t==='r'&&x.c===col;};
        if(castling[col+'k']&&R(7)&&!board[ix(rank,5)]&&!board[ix(rank,6)])

        if(castling[col+'q']&&R(0)&&!board[ix(rank,1)]&&!board[ix(rank,2)]&&!board[ix(rank,3)])

    }

}

function applyBoard(board,m,promoT){

  const p=nb[m.from];
  nb[m.from]=null;
  if(m.ep)nb[m.cap]=null;
  let np=p;
  if(m.promo)np=Object.assign({},p,{t:promoT||'q',sec:false});
  else if(p.sec&&m.qOnly)np=Object.assign({},p,{t:'q',sec:false});
  nb[m.to]=np;
  if(m.castle){
    const rank=p.c==='w'?7:0;
    const fr=m.castle==='k'?7:0,to=m.castle==='k'?5:3;
    nb[ix(rank,to)]=nb[ix(rank,fr)];

}
function castlePath(m,col){

/* truth=false: peões ocultos inimigos contam só como peões (visão do jogador);

  if(m.castle){
    for(const s of castlePath(m,col)){
      const info=attackInfo(board,s,e);
      if(info.vis)return false;
      if(truth&&info.hid.length)return false;
    }
    return true;
  }
  const nb=applyBoard(board,m,'q');
  const info=attackInfo(nb,findKing(nb,col),e);
  if(info.vis)return false;
  if(truth&&info.hid.length)return false;

}
function legalMoves(state,from,truth){
  if(!state.board[from])return [];
  return genMoves(state,from).filter(m=>isLegal(state,m,truth));

function hasLegal(state){
  for(let i=0;i<64;i++){

  }

  if(m.castle){
    for(const s of castlePath(m,col)){

    }
  }else{
    const nb=applyBoard(board,m,'q');
    attackInfo(nb,findKing(nb,col),e).hid.forEach(i=>{if(out.indexOf(i)<0)out.push(i);});
  }

}

function applyMove(state,m,promoT){

/* ---------- notação algébrica (PT-BR: R D T B C) ---------- */
function sanBase(state,m,promoT){

    s+=sq;

  }
  s+=L[eff];
  const rivals=[];
  for(let i=0;i<64;i++){
    if(i===m.from)continue;
    const q=state.board[i];
    if(!q||q.c!==p.c||q.t!==eff)continue;

  return s+sq;

function insufficient(board){

  if(ps.some(x=>x[0].t==='p'||x[0].t==='r'||x[0].t==='q'))return false;
  if(ps.length===1)return true;
  if(ps.every(x=>x[0].t==='b')){

  if(insufficient(state.board))return {check:check,over:{type:'draw',reason:'insufficient'}};
  if(state.half>=100)return {check:check,over:{type:'draw',reason:'fifty'}};

function App(){

  var s5=useState(null),pop=s5[0],setPop=s5[1];
  var s6=useState(false),muted=s6[0],setMuted=s6[1];
  var s7=useState(false),flipped=s7[0],setFlipped=s7[1];
  var s8=useState(false),confirmReset=s8[0],setConfirm=s8[1];
  var s9=useState(true),showOver=s9[0],setShowOver=s9[1];
  var m0=useState('menu'),mode=m0[0],setMode=m0[1];

  useEffect(function(){var el=histRef.current;if(el)el.scrollTop=el.scrollHeight;},[g.hist.length]);

  /* ---- efeitos ---- */
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function addFx(sq){var id=Math.random();setFx(function(f){return f.concat({id:id,sq:sq});});later(function(){setFx(function(f){return f.filter(function(x){return x.id!==id;});});},1300);}
  function addGhost(piece){var id=Math.random();setGhosts(function(a){return a.concat({id:id,t:piece.t,c:piece.c,sq:piece.sq});});later(function(){setGhosts(function(a){return a.filter(function(x){return x.id!==id;});});},520);}

  function applyEff(eff){

    (eff.sounds||[]).forEach(function(s){Sound.play(s[0],s[1]);});
    if(eff.ghost)addGhost(eff.ghost);
    if(eff.shake)doShake();
    if(eff.toast)showToast(eff.toast);
    var run=function(){(eff.fx||[]).forEach(addFx);if(eff.pop)doPop(eff.pop);};
    if(eff.fxDelay)later(run,eff.fxDelay);else run();
  }
  effRef.current=applyEff;

  /* ---- sincronização online ---- */

      var contiguous=d.rev===revRef.current+1;
      revRef.current=d.rev;
      var s;try{s=JSON.parse(d.state);}catch(e){return;}
      setG(function(prev){return Object.assign({},prev,{phase:s.phase,eng:s.eng,last:s.last,hist:s.hist,cap:s.cap,check:s.check,over:s.over,reps:s.reps,sel:null,moves:[],promo:null,flash:null});});
      if(s.over)setShowOver(true);
      if(s.phase==='pickW'&&s.hist.length===0){setShowOver(true);}

    }
  }
  function enterRoom(db,code,color,uid,status){
    roomRef.current={code:code,color:color,uid:uid};
    dbRef.current=db;
    revRef.current=0;
    saveRoom({code:code,color:color});
    setRoom({code:code,color:color,uid:uid,status:status});
    setG(newGame());setFx([]);setGhosts([]);setToast(null);setShowOver(true);setMsg('');
    setMode('online');

    unsubRef.current=db.doc('games/'+code).onSnapshot(onSnap,function(){setMsg('A conexão com a sala caiu. Volte ao menu e entre de novo.');});
  }

  async function createRoom(){

      var g0=newGame();

  async function joinRoom(rawCode,asColor){

  function handlePick(sq){

  }

  function commitMove(m,promoT){
    var e=g.eng,moved=e.board[m.from],mover=moved.c;
    var res=E.commit(e,m,promoT,g.reps);
    var cap={w:g.cap.w.slice(),b:g.cap.b.slice()};
    var eff={sounds:[],shake:false,fx:[],pop:null,toast:null,ghost:null};
    if(res.captured){cap[mover].push(res.captured.t);eff.ghost={t:res.captured.t,c:res.captured.c,sq:m.cap};}
    var kingSq=res.check?E.findKing(res.st.board,res.st.turn):null;
    var mate=res.over&&res.over.type==='mate';
    if(res.over){
      eff.sounds.push([res.captured?'capture':'move',0]);
      if(res.revealed)eff.sounds.push(['reveal',0.25]);
      eff.sounds.push([mate?'win':'draw',res.revealed?0.9:0.35]);
    }else if(res.revealed){
      eff.sounds.push(['reveal',0]);
      if(res.check)eff.sounds.push(['check',0.5]);
    }else if(res.check)eff.sounds.push(['check',0]);
    else if(res.captured)eff.sounds.push(['capture',0]);
    else eff.sounds.push(['move',0]);
    if(res.revealed){eff.fx=[res.revealSq];eff.pop=res.st.board[res.revealSq].id;}
    if(res.check||mate)eff.shake=true;
    if(mate)eff.toast={kind:'mate',text:'Xeque-mate!',sub:NAMES[mover]+' vencem a partida',ms:2600};
    else if(res.over)eff.toast={kind:'draw',text:res.over.type==='stalemate'?'Afogamento!':'Empate',sub:'',ms:2400};
    else if(res.revealed)eff.toast={kind:'reveal',text:'Dama Secreta revelada!',
      sub:'Das '+NAMES[mover]+': '+((moved.sec&&m.qOnly)?'lance exclusivo de Dama':'xeque à distância')+(res.check?' · Xeque!':'')};
    else if(res.check)eff.toast={kind:'check',text:'Xeque!',sub:'',ms:1300};
    finish(Object.assign({},g,{eng:res.st,sel:null,moves:[],promo:null,last:{from:m.from,to:m.to},
      hist:g.hist.concat([{color:mover,san:res.san,rev:res.revealed}]),cap:cap,check:kingSq,over:res.over,reps:res.reps,phase:res.over?'over':'play'}),eff);
  }

  function attempt(m){
    if(!E.isLegal(g.eng,m,true)){blocked(m);return;}
    if(m.promo){setG(Object.assign({},g,{promo:{move:m}}));return;}
    commitMove(m,null);
  }

  function onTap(sq){
    Sound.unlock();
    if(g.phase==='pickW'||g.phase==='pickB'){handlePick(sq);return;}
    if(g.phase!=='play'||g.promo)return;
    if(online&&(g.eng.turn!==room.color||room.status!=='ready'))return;
    var e=g.eng,p=e.board[sq];
    if(g.sel!=null){
      var m=g.moves.filter(function(x){return x.to===sq;})[0];
      if(m){attempt(m);return;}
      if(sq===g.sel){deselect();return;}
    }
    if(p&&p.c===e.turn)select(sq);
    else if(g.sel!=null)deselect();
  }

  function resetLocal(){
    timers.current.forEach(clearTimeout);timers.current=[];
    setG(newGame());setFx([]);setGhosts([]);setToast(null);setShake(false);setPop(null);setConfirm(false);setShowOver(true);
  }
  function startLocal(){resetLocal();setMode('local');setMsg('');}
  function rematch(){
    var g0=newGame();
    resetLocal();
    setG(g0);
    if(online)pushOnline(g0,null);
  }
  function resign(){
    var next=Object.assign({},g,{phase:'over',over:{type:'resign',winner:E.opp(room.color)},sel:null,moves:[]});
    finish(next,{sounds:[['draw',0]],toast:{kind:'draw',text:'Você desistiu',sub:'',ms:1800}});
  }
  function onReset(){
    Sound.unlock();
    if(online){
      if(g.phase==='over'){rematch();return;}
      if(!confirmReset){setConfirm(true);later(function(){setConfirm(false);},3000);return;}
      setConfirm(false);resign();return;
    }
    if(g.phase==='play'&&g.hist.length>0&&!confirmReset){
      setConfirm(true);later(function(){setConfirm(false);},3000);return;
    }
    resetLocal();
  }
  function toggleMute(){var m=!muted;setMuted(m);Sound.setMuted(m);if(!m)Sound.unlock();}
  function copyCode(){
    try{navigator.clipboard.writeText(room.code).then(function(){setMsg('Código copiado.');},function(){setMsg('Selecione o código e copie.');});}
    catch(e){setMsg('Selecione o código e copie.');}
  }

  /* ---- telas ---- */
  var header=h('header',{className:'top'},
    h('div',{className:'brand'},h(Crown,{size:24}),h('div',null,h('h1',null,'Dama Infiltrada'),h('p',null,'Xadrez com Dama Secreta'))),
    h('button',{className:'iconbtn',onClick:toggleMute,'aria-pressed':muted,'aria-label':muted?'Ligar som':'Desligar som'},muted?'Som off':'Som on'));

  if(mode==='menu'){
    return h('div',{className:'app'},header,
      h('section',{className:'menu'},
        h('button',{className:'mode',onClick:startLocal},h('strong',null,'No mesmo celular'),h('span',null,'Dois jogadores passam o aparelho, com tela de troca na escolha da Dama.')),
        h('button',{className:'mode',onClick:function(){Sound.unlock();setMode('lobby');setMsg('');}},h('strong',null,'Online'),h('span',null,'Cada um no seu celular, com uma sala e um código.')),
        saved?h('button',{className:'mode ghost',onClick:function(){Sound.unlock();joinRoom(saved.code);}},h('strong',null,'Voltar à sala '+saved.code),h('span',null,'Continuar a última partida online.')):null,
        msg?h('p',{className:'msg'},msg):null));
  }
  if(mode==='lobby'){
    return h('div',{className:'app'},header,
      h('section',{className:'card lobby'},
        h('h2',null,'Jogar online'),
        h('button',{className:'btn',disabled:busy,onClick:function(){Sound.unlock();createRoom();}},busy?'Aguarde…':'Criar sala'),
        h('div',{className:'or'},'ou entre com um código'),
        h('div',{className:'joinrow'},
          h('input',{id:'codigo',className:'codein',value:codeIn,maxLength:6,placeholder:'CÓDIGO','aria-label':'Código da sala',autoCapitalize:'characters',autoComplete:'off',
            onChange:function(ev){setCodeIn(ev.target.value.toUpperCase());}}),
          h('button',{className:'btn ghost',disabled:busy,onClick:function(){Sound.unlock();joinRoom(codeIn);}},'Entrar')),
        msg?h('p',{className:'msg'},msg):null,
        h('p',{className:'muted'},'Quem cria a sala joga de Brancas. O outro jogador entra com o código.'),
        h('button',{className:'linkbtn',onClick:function(){setMode('menu');setMsg('');}},'Voltar')));
  }

  var mine=online?room.color:null;
  var top=view?'w':'b',bottom=view?'b':'w';
  var picking=g.phase==='pickW'||g.phase==='pickB';
  var pickCol=g.phase==='pickW'?'w':'b';
  var myPick=picking&&(!online||room.color===pickCol);
  var candColor=myPick?pickCol:null;

  var banner=null;
  if(picking){
    if(myPick){
      banner=h('div',{className:'banner pick'},h(Crown,{size:20}),h('div',null,
        h('strong',null,online?'Escolha sua Dama Secreta':PLAYER[pickCol]+' ('+NAMES[pickCol]+'): escolha sua Dama Secreta'),
        h('span',null,'Toque em um dos seus peões. Ele vira Dama quando for revelado. Só você deve olhar a tela.')));
    }else{
      banner=h('div',{className:'banner'},h(Crown,{size:20}),h('div',null,
        h('strong',null,'Aguardando as '+NAMES[pickCol]),h('span',null,'O adversário está escolhendo a Dama Secreta dele.')));
    }
  }else if(g.over){
    var ov=g.over;
    banner=h('div',{className:'banner result'},h(Crown,{size:20}),h('div',null,
      h('strong',null,ov.type==='mate'?'Xeque-mate! '+NAMES[ov.winner]+' vencem':(ov.type==='resign'?NAMES[ov.winner]+' vencem por desistência':(ov.type==='stalemate'?'Empate por afogamento':'Empate'))),
      ov.type==='draw'?h('span',null,REASONS[ov.reason]):null));
  }

  var secrets=[];
  if(g.over){g.eng.board.forEach(function(p,i){if(p&&p.sec)secrets.push({c:p.c,sq:i});});}
  var ovTitle=g.over?(g.over.type==='mate'?'Xeque-mate!':(g.over.type==='resign'?'Desistência':(g.over.type==='stalemate'?'Afogamento!':'Empate'))):'';
  var ovBig=g.over?(g.over.type==='mate'||g.over.type==='resign'?NAMES[g.over.winner]+' vencem':(g.over.type==='stalemate'?'O lado a jogar não tem lances legais.':REASONS[g.over.reason])):'';

  var resetLabel;
  if(online)resetLabel=g.phase==='over'?'Nova partida':(confirmReset?'Toque de novo para desistir':'Desistir');
  else resetLabel=confirmReset?'Toque de novo para confirmar':'Reiniciar partida';

  return h('div',{className:'app'},
    header,
    online?h('div',{className:'roomline'},h('span',null,'Sala '),h('strong',null,room.code),h('span',{className:'dotsep'},'·'),h('span',null,'Você joga de '+NAMES[room.color])):null,
    banner,
    h(PlayerBar,{color:top,g:g,online:online,mine:mine===top}),
    h(Board,{eng:g.eng,flipped:view,sel:g.sel,moves:g.moves,last:g.last,check:g.check,flash:g.flash,pop:pop,fx:fx,ghosts:ghosts,
      showSecrets:!!g.over,candColor:candColor,onTap:onTap,toast:toast,promo:g.promo,shake:shake,
      onPromo:function(t){commitMove(g.promo.move,t);},onCancelPromo:function(){setG(Object.assign({},g,{promo:null}));}}),
    h(PlayerBar,{color:bottom,g:g,online:online,mine:mine===bottom}),
    msg?h('p',{className:'msg'},msg):null,
    h('div',{className:'controls'},
      h('button',{className:'btn'+(confirmReset?' danger':''),onClick:onReset},resetLabel),
      online?null:h('button',{className:'btn ghost',onClick:function(){setFlipped(!flipped);}},'Girar tabuleiro'),
      h('button',{className:'btn ghost',onClick:online?leaveRoom:function(){setMode('menu');}},online?'Sair da sala':'Menu')),
    h('section',{className:'card'},h('h2',null,'Lances'),h(History,{hist:g.hist,hrefRef:histRef})),
    h('section',{className:'card'},h('details',null,h('summary',null,'Como funciona a Dama Secreta'),
      h('ul',{className:'rules'},
        h('li',null,'Cada jogador escolhe às cegas um peão. Ele move como peão e como Dama, mas parece um peão comum para o adversário.'),
        h('li',null,'Ela se revela, virando Dama de vez, quando faz um lance que só Dama faz, ou quando dá xeque (até de longe).'),
        h('li',null,'Se o Rei inimigo tentar ir para uma casa que a Dama oculta controla, o lance é bloqueado e a Dama aparece.'),
        h('li',null,'Se uma peça inimiga estiver cravada contra o próprio Rei pela Dama oculta, o lance dela é bloqueado e a Dama aparece.'),
        h('li',null,'Depois de um bloqueio, o mesmo jogador continua e deve escolher outro lance.'),
        h('li',null,'Ao tocar na sua Dama Secreta, os pontos de movimento mostram o alcance dela. Proteja a tela do adversário.')))),
    h('p',{className:'foot'},'Regras oficiais completas: roque, en passant, promoção, xeque, xeque-mate e afogamento.'),
    g.phase==='pass'?h('div',{className:'pass'},h('div',{className:'passbox'},
      h('h2',null,'Passe o celular para o Jogador 2 (Pretas)'),
      h('p',null,'Quando estiver com o aparelho, toque em Pronto.'),
      h('button',{className:'btn big',onClick:function(){Sound.unlock();setG(Object.assign({},g,{phase:'pickB'}));}},'Pronto'))):null,
    (online&&room.status==='waiting')?h('div',{className:'ov'},h('div',{className:'ovcard'},
      h('h2',null,'Aguardando o adversário'),
      h('p',{className:'muted'},'Passe este código para o outro jogador entrar:'),
      h('div',{className:'bigcode'},room.code),
      h('div',{className:'ovbtns'},
        h('button',{className:'btn',onClick:copyCode},'Copiar código'),
        h('button',{className:'btn ghost',onClick:leaveRoom},'Cancelar')),
      msg?h('p',{className:'msg'},msg):null,
      h('p',{className:'muted small'},'Ele deve abrir o jogo, tocar em Online e depois em Entrar.'))):null,
    (g.over&&showOver)?h('div',{className:'ov'},h('div',{className:'ovcard'},
      h(Crown,{size:44}),
      h('h2',null,ovTitle),
      h('p',{className:'big'},ovBig),
      secrets.length?h('ul',{className:'sec'},secrets.map(function(x,i){return h('li',{key:i},'Dama Secreta das '+NAMES[x.c]+': peão em '+E.sqName(x.sq)+' (nunca revelada)');})):null,
      h('div',{className:'ovbtns'},
        h('button',{className:'btn ghost',onClick:function(){setShowOver(false);}},'Ver tabuleiro'),
        h('button',{className:'btn',onClick:online?rematch:resetLocal},'Nova partida')))):null);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();

</script>
</body>
</html>
